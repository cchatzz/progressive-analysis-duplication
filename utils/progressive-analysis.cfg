# NiCad configuration used by this app, installed into NiCad's own config
# directory at run time. minsize matches Simian's -threshold=15 so both
# detectors ignore blocks shorter than 15 lines.

threshold=0.10
minsize=15
maxsize=2500

transform=none
rename=blind
filter=none
abstract=none
normalize=none

# The app reads the clone-pairs report and clusters it itself, so neither of
# these is required; both are kept on for cross-checking NiCad's own output.
cluster=yes
report=yes

include=""
exclude=""
