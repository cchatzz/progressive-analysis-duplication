# NiCad configuration used by this app, installed into NiCad's own config
# directory at run time. minsize matches Simian's -threshold=15 so both
# detectors ignore blocks shorter than 15 lines.

threshold=0.10
minsize=15
maxsize=2500

transform=none
rename=blind
filter=none
abstract=none
normalize=none

# Clustering is required: the parser reads the clone-classes report.
cluster=yes
# The withsource XML/HTML reports are not consumed, so skip generating them.
report=yes

include=""
exclude=""
